name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, dom, xml, xmlwriter, :bcmath
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer test
      - run: composer test:readme
      - run: composer analyse
      - run: composer test:no-bcmath
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  geometry-without-curl:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: :curl, :bcmath
          coverage: none
          tools: composer:v2
      - run: php -r 'if (function_exists("curl_init")) { exit(1); }'
      - run: composer install --no-dev --no-interaction --prefer-dist
      - run: php -r 'require "vendor/autoload.php"; require "tests/without-geocoding-extensions.php";'
      - run: composer test:no-bcmath
