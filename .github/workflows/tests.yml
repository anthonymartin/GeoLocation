name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, dom, xml, xmlwriter, :bcmath
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer test
      - run: composer test:no-bcmath
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  legacy-runtime:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['5.4', '5.5', '5.6', '7.0', '7.1', '7.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, :bcmath
          coverage: none
          tools: composer:2.2
      - run: composer install --no-dev --no-interaction --prefer-dist
      - run: php -r 'require "vendor/autoload.php"; require "tests/legacy-runtime.php";'
      - run: php -n tests/without-bcmath.php
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  geometry-without-curl:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        php: ['7.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, :curl, :bcmath
          coverage: none
          tools: composer:v2
      - run: php -r 'if (function_exists("curl_init")) { exit(1); }'
      - run: composer install --no-dev --no-interaction --prefer-dist
      - run: php -r 'require "vendor/autoload.php"; require "tests/legacy-runtime.php";'
      - run: php tests/without-geocoding-extensions.php
      - run: php -n tests/without-geocoding-extensions.php
      - run: composer test:no-bcmath
