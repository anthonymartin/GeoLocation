deptrac:
  paths: [src, vendor/psr/http-client/src, vendor/psr/http-factory/src, vendor/psr/http-message/src]
  analyser:
    types: [class, use, file, function_call]
  ignore_uncovered_internal_classes: false
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: '^AnthonyMartin\\GeoLocation\\(?!(Geodesy|Format|Sql|Index|Geocoding|Laravel)\\)'
    - name: Geocoding
      collectors:
        - { type: classLike, value: '^AnthonyMartin\\GeoLocation\\(Geocoding\\)' }
        # Declaration-only root alias belongs to the adapter layer.
        - { type: directory, value: 'src/AnthonyMartin/GeoLocation/(Geocoding/.*|GoogleGeocoder\.php)$' }
    - name: Geodesy
      collectors:
        - { type: classLike, value: '^AnthonyMartin\\GeoLocation\\Geodesy\\' }
    - name: Format
      collectors:
        - { type: classLike, value: '^AnthonyMartin\\GeoLocation\\Format\\' }
    - name: Sql
      collectors:
        - { type: classLike, value: '^AnthonyMartin\\GeoLocation\\Sql\\' }
    - name: Index
      collectors:
        - { type: classLike, value: '^AnthonyMartin\\GeoLocation\\Index\\' }
    - name: Laravel
      collectors:
        - { type: classLike, value: '^AnthonyMartin\\GeoLocation\\Laravel\\' }
    - name: PHP
      collectors:
        - { type: php_internal, value: '^(Throwable|Exception|LogicException|InvalidArgumentException|RuntimeException|UnexpectedValueException|OutOfBoundsException|stdClass|Stringable|JsonSerializable|Iterator|IteratorAggregate|Traversable|Countable|Generator)$' }
    - name: Transport
      collectors:
        - { type: classLike, value: '^CurlHandle$' }
    - name: PSR
      collectors:
        - { type: interface, value: '^Psr\\' }
  ruleset:
    PSR: [PHP]
    Core: [PHP]
    Geodesy: [Core, PHP, PSR]
    Format: [Core, PHP, PSR]
    Sql: [Core, PHP, PSR]
    Index: [Core, PHP, PSR]
    Geocoding: [Core, PHP, PSR, Transport]
    Laravel: [Core, PHP, PSR]
